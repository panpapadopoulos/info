<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | Panagiotis Papadopoulos</title>
  <link rel="shortcut icon" type="image/png" href="./assets/images/logos/favicon.ico" />
  <link rel="stylesheet" href="./assets/libs/owl.carousel/dist/assets/owl.carousel.min.css">
  <link rel="stylesheet" href="./assets/libs/aos-master/dist/aos.css">
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/latest/css/font-awesome.min.css" rel="stylesheet">
  <style>
    html {
      scroll-behavior: smooth;
    }

    .error-code {
      font-size: 8rem;
      font-weight: 900;
      background: linear-gradient(135deg, #c1ff72 0%, #1f2a2e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.02);
      }
    }

    .quick-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      background-color: #1f2a2e;
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s ease;
      gap: 8px;
    }

    .quick-link:hover {
      background-color: #c1ff72;
      color: #1f2a2e;
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(193, 255, 114, 0.3);
    }

    .brand-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1f2a2e;
    }

    .floating-shapes {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    .shape {
      position: absolute;
      background-color: #c1ff72;
      opacity: 0.1;
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    .shape:nth-child(1) {
      width: 80px;
      height: 80px;
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }

    .shape:nth-child(2) {
      width: 60px;
      height: 60px;
      top: 70%;
      left: 80%;
      animation-delay: 2s;
    }

    .shape:nth-child(3) {
      width: 100px;
      height: 100px;
      top: 40%;
      left: 70%;
      animation-delay: 4s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(10deg);
      }
    }
  </style>
</head>

<body>

  <!--  Page Wrapper -->
  <div class="page-wrapper overflow-hidden">

    <section

        <div class="shape"></div>

            data-aos-delay="100" data-aos-duration="1000">
            Panagiotis Papadopoulos
          </a>

          <!-- Error Code -->
          <div class="error-code" data-aos="zoom-in" data-aos-delay="200" data-aos-duration="1000">404</div>

          <!-- Message -->
          <h2 class="mb-0" data-aos="fade-up" data-aos-delay="300" data-aos-duration="1000">
            Looks like this page got lost in the code...
          </h2>
          <p class="text-muted fs-5 mb-4" data-aos="fade-up" data-aos-delay="400" data-aos-duration="1000">

          </p>

          <!-- Quick Links -->
          <div class="d-flex flex-wrap justify-content-center gap-3" data-aos="fade-up" data-aos-delay="500"
            data-aos-duration="1000">
            <a href="./html/index.html" class="quick-link">
              <i class="fa fa-home"></i> Home
            </a>
            <a href="./html/index.html#about" class="quick-link">
              <i class="fa fa-user"></i> About
            </a>
            <a href="./html/index.html#projects" class="quick-link">

            </a>
            <a href="./html/index.html#contact" class="quick-link">
              <i class="fa fa-envelope"></i> Contact
            </a>
          </div>

        </div>
      </div>
    </section>

  </div>

  <script src="./assets/libs/jquery/dist/jquery.min.js"></script>
  <script src="./assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/libs/aos-master/dist/aos.js"></script>
